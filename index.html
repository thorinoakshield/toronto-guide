<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Old Toronto, for visitors</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
<style>
  :root{
    --ink:#1c2430;
    --ink-soft:#54606f;
    --line:#e3ddd0;
    --paper:#fffefb;
  }
  *{box-sizing:border-box;}
  html,body{
    margin:0;
    height:100%;
    font-family:system-ui,-apple-system,"Segoe UI",sans-serif;
    color:var(--ink);
  }
  #map{
    position:fixed;
    inset:0;
  }
  .panel{
    position:absolute;
    top:16px;
    left:16px;
    z-index:1000;
    width:360px;
    max-width:calc(100vw - 32px);
    max-height:calc(100vh - 32px);
    display:flex;
    flex-direction:column;
    background:var(--paper);
    border-radius:16px;
    box-shadow:0 16px 40px rgba(20,20,15,0.22), 0 0 0 1px rgba(20,20,15,0.05);
  }
  .panel-head{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:0.5rem;
    padding:0.8rem 0.9rem;
  }
  .panel h1{
    font-size:1.1rem;
    margin:0;
    font-weight:700;
    letter-spacing:-0.01em;
  }
  .panel-head-actions{
    display:flex;
    align-items:center;
    gap:0.3rem;
    flex:none;
  }
  .collapse-btn, .icon-btn{
    border:none;
    background:none;
    cursor:pointer;
    font-size:1.1rem;
    color:var(--ink-soft);
    padding:2px 4px;
    line-height:1;
    flex:none;
  }
  .icon-btn:hover, .collapse-btn:hover{ color:var(--ink); }
  .icon-btn.small{ font-size:0.85rem; }
  .panel-body{
    overflow-y:auto;
    padding:0 0.9rem 0.9rem;
  }
  .panel.is-collapsed .panel-body{ display:none; }

  .panel.is-minimized{
    width:44px;
    border-radius:50%;
  }
  .panel.is-minimized .panel-head{
    padding:0;
    width:44px;
    height:44px;
    justify-content:center;
  }
  .panel.is-minimized h1,
  .panel.is-minimized .collapse-btn,
  .panel.is-minimized .panel-body{
    display:none;
  }
  .panel.is-minimized #minimizeBtn{
    width:100%;
    height:100%;
  }

  .list-head{
    display:flex;
    align-items:center;
    justify-content:space-between;
    font-size:0.7rem;
    text-transform:uppercase;
    letter-spacing:0.08em;
    color:var(--ink-soft);
    font-weight:700;
    margin-top:0.2rem;
  }
  .list{
    display:flex;
    flex-direction:column;
    gap:0px;
    border-top:1px solid var(--line);
    padding-top:0.5rem;
    margin-top:0.6rem;
  }
  .list.is-collapsed{ display:none; }
  .item{
    display:flex;
    align-items:center;
    gap:0.45rem;
    width:100%;
    text-align:left;
    background:none;
    border:none;
    border-radius:6px;
    padding:0.2rem 0.4rem;
    font-size:0.76rem;
    font-family:inherit;
    color:var(--ink);
    cursor:pointer;
  }
  .item:hover{ background:#f3efe4; }
  .item.is-active{ background:#eee7d6; font-weight:600; }
  .item .dot{
    width:9px;
    height:9px;
    border-radius:50%;
    flex:none;
    box-shadow:0 0 0 2px rgba(0,0,0,0.06);
  }
  .item:focus-visible{ outline:2px solid var(--ink); outline-offset:1px; }

  .overview{
    margin-top:0.9rem;
    padding-top:0.9rem;
    border-top:1px solid var(--line);
    display:none;
  }
  .overview.is-visible{ display:block; }
  .overview h2{
    font-size:1rem;
    margin:0 0 0.5rem;
  }
  .overview-photos{
    display:flex;
    flex-direction:column;
    gap:8px;
    margin-bottom:0.6rem;
  }
  .overview-photos a{
    display:block;
    aspect-ratio:4/3;
    border-radius:8px;
    overflow:hidden;
    background:var(--line);
  }
  .overview-photos img{
    width:100%;
    height:100%;
    object-fit:cover;
    display:block;
  }
  .overview h3{
    font-size:0.7rem;
    text-transform:uppercase;
    letter-spacing:0.08em;
    margin:0.7rem 0 0.35rem;
    color:var(--ink-soft);
    font-weight:700;
  }
  .overview p{
    font-size:0.85rem;
    line-height:1.55;
    margin:0;
    color:#33404d;
  }
  .photo-credit{
    font-size:0.65rem;
    color:#a09a8c;
    margin-top:0.3rem;
  }
  .photo-credit a{ color:inherit; }

  .leaflet-tooltip.hood-label{
    background:rgba(255,254,251,0.92);
    border:none;
    box-shadow:0 1px 4px rgba(20,20,15,0.25);
    border-radius:6px;
    padding:2px 7px;
    font-family:system-ui,-apple-system,"Segoe UI",sans-serif;
    font-weight:700;
    font-size:12.5px;
    color:var(--ink);
    pointer-events:none;
  }
  .leaflet-tooltip.hood-label::before{ display:none; }

  .attrib-note{
    position:absolute;
    bottom:8px;
    left:16px;
    z-index:1000;
    font-size:0.7rem;
    color:rgba(30,30,25,0.55);
    background:rgba(255,254,251,0.75);
    padding:2px 7px;
    border-radius:6px;
    pointer-events:none;
  }

  .popup{
    position:absolute;
    top:16px;
    right:16px;
    z-index:1000;
    width:300px;
    max-width:calc(100vw - 32px);
    max-height:calc(100vh - 32px);
    overflow-y:auto;
    background:var(--paper);
    border-radius:16px;
    box-shadow:0 16px 40px rgba(20,20,15,0.22), 0 0 0 1px rgba(20,20,15,0.05);
    padding:1.1rem 1.2rem 1.2rem;
    transform:translateX(calc(100% + 32px));
    opacity:0;
    transition:transform 0.25s ease, opacity 0.25s ease;
  }
  .popup.is-open{
    transform:translateX(0);
    opacity:1;
  }
  .popup-close{
    position:absolute;
    top:10px;
    right:12px;
    border:none;
    background:none;
    font-size:1.3rem;
    line-height:1;
    color:var(--ink-soft);
    cursor:pointer;
    padding:4px;
  }
  .popup-close:hover{ color:var(--ink); }
  .popup h2{
    font-size:1.1rem;
    margin:0 1.6rem 0.7rem 0;
  }
  .popup-section{
    margin-top:0.7rem;
    padding-top:0.7rem;
    border-top:1px solid var(--line);
  }
  .popup-section h3{
    font-size:0.7rem;
    text-transform:uppercase;
    letter-spacing:0.08em;
    margin:0 0 0.35rem;
    color:var(--ink-soft);
    font-weight:700;
  }
  .popup-section ul{
    margin:0;
    padding-left:1.1rem;
    font-size:0.85rem;
    line-height:1.55;
    color:#33404d;
  }

  .pick-section-toggle{
    width:100%;
    display:flex;
    align-items:center;
    justify-content:space-between;
    background:none;
    border:none;
    padding:0;
    margin:0;
    font-family:inherit;
    font-size:0.7rem;
    text-transform:uppercase;
    letter-spacing:0.08em;
    color:var(--ink-soft);
    font-weight:700;
    cursor:pointer;
  }
  .pick-section-toggle:hover{ color:var(--ink); }
  .pick-section-toggle:focus-visible{ outline:2px solid var(--ink); outline-offset:2px; }
  .pick-section-toggle .chevron{
    font-size:0.55rem;
    transition:transform 0.2s ease;
  }
  .pick-section.is-collapsed .pick-section-toggle .chevron{
    transform:rotate(180deg);
  }
  .pick-section-body{
    display:flex;
    flex-direction:column;
    gap:0.8rem;
    margin-top:0.65rem;
  }
  .pick-section.is-collapsed .pick-section-body{
    display:none;
  }
  .pick-section.is-empty{
    display:none;
  }

  .pick{
    padding-bottom:0.8rem;
    border-bottom:1px solid var(--line);
    border-radius:8px;
    transition:background-color 0.3s ease;
  }
  .pick.is-flashed{
    background-color:#eee7d6;
  }
  .pick:last-child{
    border-bottom:none;
    padding-bottom:0;
  }
  .pick-header{
    display:flex;
    align-items:baseline;
    gap:0.4rem;
  }
  .pick-number{
    flex:none;
    width:17px;
    height:17px;
    border-radius:50%;
    background:var(--ink);
    color:#fff;
    font-size:0.62rem;
    font-weight:700;
    display:flex;
    align-items:center;
    justify-content:center;
    transform:translateY(1px);
  }
  .pick-number.cat-activity, .pick-marker.cat-activity{ background:#c1752e; }
  .pick-number.cat-shop, .pick-marker.cat-shop{ background:#3b6ea5; }
  .pick-number.cat-restaurant, .pick-marker.cat-restaurant{ background:#a83e3e; }
  .pick-number.cat-bar, .pick-marker.cat-bar{ background:#3f8a4c; }
  .pick-name{
    font-size:0.85rem;
    font-weight:700;
    margin:0;
  }
  .pick-note{
    font-size:0.8rem;
    line-height:1.5;
    margin:0.2rem 0 0;
    color:#33404d;
  }
  .pick-flag{
    display:inline-block;
    margin-top:0.35rem;
    font-size:0.65rem;
    font-weight:700;
    text-transform:uppercase;
    letter-spacing:0.03em;
    color:#8a3b3b;
    background:#fbeaea;
    padding:2px 7px;
    border-radius:999px;
  }
  .pick-photos{
    display:flex;
    gap:6px;
    margin-top:0.5rem;
  }
  .pick-photos img{
    flex:1;
    width:0;
    aspect-ratio:1;
    object-fit:cover;
    border-radius:8px;
    background:var(--line);
  }

  .pick-marker{
    width:22px;
    height:22px;
    border-radius:50%;
    background:var(--ink);
    color:#fff;
    display:flex;
    align-items:center;
    justify-content:center;
    font-family:system-ui,-apple-system,"Segoe UI",sans-serif;
    font-size:11px;
    font-weight:700;
    box-shadow:0 2px 6px rgba(0,0,0,0.35), 0 0 0 2px #fff;
  }

  .itin-banner{
    position:absolute;
    top:16px;
    left:50%;
    transform:translateX(-50%);
    z-index:1000;
    width:min(340px, calc(100vw - 800px));
    min-width:260px;
    background:var(--paper);
    border-radius:16px;
    box-shadow:0 16px 40px rgba(20,20,15,0.22), 0 0 0 1px rgba(20,20,15,0.05);
    padding:0.7rem 0.9rem;
  }
  .itin-banner-head{
    display:flex;
    align-items:center;
    justify-content:space-between;
  }
  .itin-banner-head h2{
    font-size:0.9rem;
    margin:0;
    font-weight:700;
  }
  .itin-banner-body{
    display:flex;
    gap:6px;
    margin-top:0.6rem;
  }
  .itin-banner.is-collapsed .itin-banner-body{ display:none; }
  .itin-btn{
    flex:1;
    padding:0.4rem 0.3rem;
    border-radius:8px;
    border:1.5px solid #d8c9ae;
    background:#fff;
    font-size:0.76rem;
    font-family:inherit;
    cursor:pointer;
    color:var(--ink);
  }
  .itin-btn:hover{ border-color:var(--ink); }
  .itin-btn.is-active{
    background:var(--ink);
    color:#fff;
    border-color:var(--ink);
  }
  .itin-btn:focus-visible{ outline:2px solid var(--ink); outline-offset:1px; }

  .itin-card{
    margin-top:0.9rem;
    padding-top:0.9rem;
    border-top:1px solid var(--line);
  }
  .itin-card:first-of-type{
    margin-top:0.7rem;
    padding-top:0;
    border-top:none;
  }
  .itin-card h3{
    font-size:1rem;
    margin:0 0 0.5rem;
    padding-bottom:0.3rem;
    border-bottom:3px solid;
  }

  .locate-btn{
    position:absolute;
    bottom:8px;
    right:16px;
    z-index:1000;
    width:42px;
    height:42px;
    border-radius:50%;
    border:none;
    background:var(--paper);
    box-shadow:0 4px 14px rgba(20,20,15,0.28), 0 0 0 1px rgba(20,20,15,0.06);
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:1.15rem;
  }
  .locate-btn:hover{ background:#f3efe4; }
  .locate-btn.is-active{ color:#1a6fd6; }
  .locate-note{
    position:absolute;
    bottom:58px;
    right:16px;
    z-index:1000;
    max-width:220px;
    font-size:0.75rem;
    background:var(--paper);
    color:#8a3b3b;
    padding:6px 10px;
    border-radius:8px;
    box-shadow:0 4px 14px rgba(20,20,15,0.2);
    display:none;
  }
  .locate-note.is-visible{ display:block; }

  .you-are-here{
    width:16px;
    height:16px;
    border-radius:50%;
    background:#1a6fd6;
    border:3px solid #fff;
    box-shadow:0 0 0 2px #1a6fd6, 0 2px 6px rgba(0,0,0,0.4);
  }

  @media (max-width:640px){
    .itin-banner{ top:10px; left:10px; right:10px; transform:none; width:auto; min-width:0; }
    .panel{ top:66px; left:10px; width:calc(100vw - 20px); max-height:36vh; }
    .popup{
      top:auto; right:10px; bottom:10px; left:10px;
      width:calc(100vw - 20px); max-width:none;
      max-height:44vh;
      transform:translateY(calc(100% + 20px));
    }
    .popup.is-open{ transform:translateY(0); }
    .locate-btn{ bottom:10px; right:10px; }
    .locate-note{ bottom:60px; right:10px; }
    .attrib-note{ display:none; }

    .panel h1{ font-size:0.95rem; }
    .collapse-btn{ font-size:0.95rem; }
    .item{ font-size:0.7rem; padding:0.16rem 0.35rem; }
    .item .dot{ width:8px; height:8px; }
    .overview h2{ font-size:0.9rem; }
    .overview h3{ font-size:0.62rem; }
    .overview p{ font-size:0.78rem; line-height:1.45; }
    .photo-credit{ font-size:0.6rem; }
    .popup h2{ font-size:0.95rem; }
    .popup-section h3{ font-size:0.62rem; }
    .popup-section ul{ font-size:0.78rem; line-height:1.45; }
  }
</style>
</head>
<body>

<div id="map" role="application" aria-label="Map of Old Toronto with thirteen neighbourhoods highlighted"></div>

<div class="panel" id="panel">
  <div class="panel-head">
    <h1>Toronto</h1>
    <div class="panel-head-actions">
      <button class="icon-btn" id="minimizeBtn" title="Minimize" aria-label="Minimize panel">&#8211;</button>
      <button class="collapse-btn" id="collapseBtn" aria-label="Collapse panel">&#9650;</button>
    </div>
  </div>
  <div class="panel-body" id="panelBody">
    <div class="list-head">
      <span>Neighbourhoods</span>
      <button class="icon-btn small" id="listCollapseBtn" aria-label="Collapse neighbourhood list">&#9650;</button>
    </div>
    <div class="list" id="list"></div>
    <div class="overview" id="overview">
      <h2 id="overviewTitle">Neighbourhood</h2>
      <div class="overview-photos" id="overviewPhotos"></div>
      <p class="photo-credit">Photos via Wikimedia Commons contributors</p>
      <h3>History</h3>
      <p id="overviewHistory"></p>
    </div>
  </div>
</div>

<div class="itin-banner" id="itinBanner">
  <div class="itin-banner-head">
    <h2>Itineraries</h2>
    <button class="icon-btn" id="itinCollapseBtn" aria-label="Collapse itineraries">&#9650;</button>
  </div>
  <div class="itin-banner-body" id="itinBannerBody">
    <button class="itin-btn" data-option="option1" type="button" aria-pressed="false">Option 1</button>
    <button class="itin-btn" data-option="option2" type="button" aria-pressed="false">Option 2</button>
    <button class="itin-btn" data-option="option3" type="button" aria-pressed="false">Option 3</button>
    <button class="itin-btn" data-option="option4" type="button" aria-pressed="false">Option 4</button>
  </div>
</div>

<div class="popup" id="popup">
  <button class="popup-close" id="popupClose" aria-label="Close">&times;</button>
  <h2 id="popupTitle">Neighbourhood</h2>

  <div class="popup-section pick-section" id="sectionRestaurants">
    <button class="pick-section-toggle" aria-expanded="true">
      <span>Restaurants</span>
      <span class="chevron">&#9650;</span>
    </button>
    <div class="pick-section-body" id="picksRestaurants"></div>
  </div>

  <div class="popup-section pick-section" id="sectionBars">
    <button class="pick-section-toggle" aria-expanded="true">
      <span>Bars/Clubs</span>
      <span class="chevron">&#9650;</span>
    </button>
    <div class="pick-section-body" id="picksBars"></div>
  </div>

  <div class="popup-section pick-section" id="sectionActivities">
    <button class="pick-section-toggle" aria-expanded="true">
      <span>Activities</span>
      <span class="chevron">&#9650;</span>
    </button>
    <div class="pick-section-body" id="picksActivities"></div>
  </div>

  <div class="popup-section pick-section" id="sectionShops">
    <button class="pick-section-toggle" aria-expanded="true">
      <span>Shops</span>
      <span class="chevron">&#9650;</span>
    </button>
    <div class="pick-section-body" id="picksShops"></div>
  </div>
</div>

<div class="popup itin-stack" id="itineraryStack">
  <button class="popup-close" id="itineraryStackClose" aria-label="Close itinerary">&times;</button>
  <h2 id="itineraryStackTitle">Itinerary</h2>
  <div id="itineraryCards"></div>
</div>

<div class="attrib-note">Scoped to the old City of Toronto — panning stops at its edges.</div>
<button class="locate-btn" id="locateBtn" title="Show my location" aria-label="Show my location">&#8982;</button>
<div class="locate-note" id="locateNote"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
<script>
  const oldTorontoBounds = L.latLngBounds(
    [43.630, -79.470],
    [43.685, -79.335]
  );

  const map = L.map('map', {
    maxBounds: oldTorontoBounds.pad(0.03),
    maxBoundsViscosity: 1.0,
    minZoom: 12,
    maxZoom: 18,
    zoomSnap: 0.25,
    zoomControl: false
  });
  L.control.zoom({ position: 'bottomleft' }).addTo(map);
  map.fitBounds(oldTorontoBounds);

  L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png', {
    attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors &copy; <a href="https://carto.com/attributions">CARTO</a>',
    subdomains: 'abcd',
    maxZoom: 20
  }).addTo(map);

  const neighbourhoods = [
    {
      id: 'roncesvalles',
      name: 'Roncesvalles',
      color: '#b88e35',
      coords: [[[43.6563318,-79.4524437],[43.6562365,-79.4524201],[43.655237,-79.4521677],[43.6551365,-79.4521423],[43.6550279,-79.4521145],[43.6547323,-79.4520356],[43.6540775,-79.4518646],[43.6539639,-79.4518363],[43.6539128,-79.4518245],[43.653665,-79.4517653],[43.6535538,-79.4517344],[43.6530063,-79.4515694],[43.6525052,-79.4514166],[43.6519435,-79.4512276],[43.6410766,-79.4470161],[43.6390375,-79.4462192],[43.6389311,-79.4461895],[43.6388691,-79.446186],[43.6388066,-79.4461905],[43.6387154,-79.4462194],[43.6394903,-79.4422232],[43.642228,-79.4286157],[43.6423101,-79.4282009],[43.6425511,-79.4287324],[43.642707,-79.4290765],[43.643636,-79.4311626],[43.6462888,-79.4368509],[43.6473604,-79.4391198],[43.6485355,-79.4410189],[43.6491042,-79.4418316],[43.6499494,-79.4429433],[43.6506442,-79.4437212],[43.6509031,-79.4440166],[43.6568596,-79.4498444],[43.6567686,-79.4502434],[43.6565659,-79.4512195],[43.6564938,-79.4516619],[43.6563657,-79.4522796],[43.6563347,-79.4524297],[43.6563318,-79.4524437]]],
      outlineOnly: false,
      history: "Named after the Battle of Roncesvalles in Spain, the avenue grew up as a streetcar shopping strip in the early 1900s. Waves of Polish immigration after the Second World War gave it the nickname “Little Poland,” and it still hosts one of the city's biggest Polish festivals every September.",

  const list = document.getElementById('list');
  const layers = {};
  let activeId = null;

  function restingStyle(hood){
    return hood.outlineOnly
      ? { weight: 2.5, opacity: 0.9, fillOpacity: 0.05 }
      : { weight: 2.5, opacity: 0.9, fillOpacity: 0.32 };
  }
  function activeStyle(){
    return { weight: 4, opacity: 1, fillOpacity: 0.04 };
  }

  neighbourhoods.forEach(hood => {
    const style = Object.assign({ color: hood.color, fillColor: hood.color }, restingStyle(hood));
    const polygon = L.polygon(hood.coords, style).addTo(map);

    polygon.bindTooltip(hood.name, {
      permanent: true,
      direction: 'center',
      className: 'hood-label'
    });

    polygon.on('click', () => select(hood.id));
    layers[hood.id] = polygon;

    const item = document.createElement('button');
    item.className = 'item';
    item.type = 'button';
    item.dataset.id = hood.id;
    item.innerHTML = '<span class="dot" style="background:' + hood.color + '"></span>' + hood.name;
    item.addEventListener('click', () => select(hood.id));
    list.appendChild(item);
  });

  // --- left panel: overview (photos + history) ---
  const overview = document.getElementById('overview');
  const overviewTitle = document.getElementById('overviewTitle');
  const overviewPhotos = document.getElementById('overviewPhotos');
  const overviewHistory = document.getElementById('overviewHistory');

  function renderOverview(hood){
    overviewTitle.textContent = hood.name;
    overviewPhotos.innerHTML = hood.images.map(im =>
      '<a href="' + im.page + '" target="_blank" rel="noopener"><img src="' + im.url + '" alt="' + hood.name + '" loading="lazy"></a>'
    ).join('');
    overviewHistory.textContent = hood.history;
    overview.classList.add('is-visible');
  }

  // --- right popup: personal picks, grouped into restaurants / activities / shops ---
  const popup = document.getElementById('popup');
  const popupTitle = document.getElementById('popupTitle');
  const sectionRestaurants = document.getElementById('sectionRestaurants');
  const sectionBars = document.getElementById('sectionBars');
  const sectionActivities = document.getElementById('sectionActivities');
  const sectionShops = document.getElementById('sectionShops');
  const picksRestaurants = document.getElementById('picksRestaurants');
  const picksBars = document.getElementById('picksBars');
  const picksActivities = document.getElementById('picksActivities');
  const picksShops = document.getElementById('picksShops');
  document.getElementById('popupClose').addEventListener('click', closePopup);

  document.querySelectorAll('.pick-section-toggle').forEach(btn => {
    btn.addEventListener('click', () => {
      const section = btn.closest('.pick-section');
      const collapsed = section.classList.toggle('is-collapsed');
      btn.setAttribute('aria-expanded', collapsed ? 'false' : 'true');
    });
  });

  // Splits picks into the three panel categories and numbers them sequentially
  // (restaurants, then activities, then shops) so a pick's number matches its map pin.
  function categorizePicks(picks){
    picks = picks || [];
    const restaurants = picks.filter(p => p.category === 'restaurant');
    const bars = picks.filter(p => p.category === 'bar');
    const shops = picks.filter(p => p.category === 'shop');
    const activities = picks.filter(p => p.category !== 'restaurant' && p.category !== 'bar' && p.category !== 'shop');
    let n = 0;
    const numbered = arr => arr.map(p => ({ pick: p, num: ++n }));
    return {
      restaurants: numbered(restaurants),
      bars: numbered(bars),
      activities: numbered(activities),
      shops: numbered(shops)
    };
  }

  function categoryClass(pick){
    if(pick.category === 'restaurant') return 'cat-restaurant';
    if(pick.category === 'shop') return 'cat-shop';
    if(pick.category === 'bar') return 'cat-bar';
    return 'cat-activity';
  }

  function pickCardHtml(pick, num){
    const flag = pick.flag ? '<span class="pick-flag">' + pick.flag + '</span>' : '';
    const photos = (pick.photos || []).map(src =>
      '<img src="' + src + '" alt="' + pick.name + '">'
    ).join('');
    return '<div class="pick" id="pickCard-' + num + '">' +
      '<div class="pick-header"><span class="pick-number ' + categoryClass(pick) + '">' + num + '</span><p class="pick-name">' + pick.name + '</p></div>' +
      '<p class="pick-note">' + pick.note + '</p>' +
      flag +
      (photos ? '<div class="pick-photos">' + photos + '</div>' : '') +
      '</div>';
  }

  function fillSection(bodyEl, sectionEl, items){
    sectionEl.classList.toggle('is-empty', !items.length);
    bodyEl.innerHTML = items.map(it => pickCardHtml(it.pick, it.num)).join('');
  }

  let pickMarkers = [];
  function clearPickMarkers(){
    pickMarkers.forEach(m => map.removeLayer(m));
    pickMarkers = [];
  }

  function renderPickMarkers(cats){
    clearPickMarkers();
    [].concat(cats.restaurants, cats.bars, cats.activities, cats.shops).forEach(({ pick, num }) => {
      if(pick.path){
        const line = L.polyline(pick.path, {
          color: '#f2d98a',
          weight: 7,
          opacity: 0.75,
          lineCap: 'round'
        }).addTo(map);
        line.on('click', () => highlightPick(num));
        pickMarkers.push(line);
      }
      if(!pick.coords) return;
      const icon = L.divIcon({
        className: 'pick-marker-icon',
        html: '<div class="pick-marker ' + categoryClass(pick) + '">' + num + '</div>',
        iconSize: [22,22],
        iconAnchor: [11,11]
      });
      const marker = L.marker(pick.coords, { icon, keyboard: false, interactive: true }).addTo(map);
      marker.on('click', () => highlightPick(num));
      pickMarkers.push(marker);
    });
  }

  let highlightTimeout = null;
  function highlightPick(num){
    const card = document.getElementById('pickCard-' + num);
    if(!card) return;
    const section = card.closest('.pick-section');
    if(section && section.classList.contains('is-collapsed')){
      section.classList.remove('is-collapsed');
      section.querySelector('.pick-section-toggle').setAttribute('aria-expanded', 'true');
    }
    document.querySelectorAll('.pick.is-flashed').forEach(el => el.classList.remove('is-flashed'));
    card.scrollIntoView({ behavior: 'smooth', block: 'center' });
    card.classList.add('is-flashed');
    clearTimeout(highlightTimeout);
    highlightTimeout = setTimeout(() => card.classList.remove('is-flashed'), 1600);
  }

  function isMobile(){
    return window.matchMedia('(max-width: 640px)').matches;
  }

  // Smooth zoom, with a self-healing fallback: Leaflet's zoom animation waits for a
  // CSS transitionend event to unlock the map, and that event can fail to fire (browser/GPU
  // dependent) — when it does, the map gets stuck mid-animation forever. _stop() before AND
  // after clears that lock; the watchdog forces a snap-to-target if the animation never settles.
  function safeFitBounds(bounds, options){
    map._stop();
    map.fitBounds(bounds, Object.assign({}, options, { animate: true }));
    clearTimeout(safeFitBounds._watchdog);
    safeFitBounds._watchdog = setTimeout(() => {
      if(map._animatingZoom){
        map._stop();
        map.fitBounds(bounds, Object.assign({}, options, { animate: false }));
      }
    }, 900);
  }

  function closePopup(){
    popup.classList.remove('is-open');
    clearPickMarkers();
    if(activeId && layers[activeId]){
      const hood = neighbourhoods.find(h => h.id === activeId);
      layers[activeId].setStyle(restingStyle(hood));
    }
    activeId = null;
    document.querySelectorAll('.item').forEach(el => el.classList.remove('is-active'));
    const itin = ITINERARIES[activeItineraryOption];
    if(itin){
      itineraryStack.classList.add('is-open');
      safeFitBounds(unionBounds(itin.order), { padding: [70,70] });
    } else {
      safeFitBounds(oldTorontoBounds, {});
    }
    if(isMobile()) setPanelCollapsed(false);
  }

  function select(id){
    if(activeItineraryOption){
      const itin = ITINERARIES[activeItineraryOption];
      if(itin && itin.order.includes(id)){
        // Neighbourhood is part of the active itinerary: open it like normal, but
        // leave the itinerary's purple/red highlight coloring on the map untouched
        // (the styling calls below only ever touch weight/opacity, never color).
        itineraryStack.classList.remove('is-open');
      } else {
        deactivateItinerary();
      }
    }

    if(id === activeId){
      closePopup();
      return;
    }
    const hood = neighbourhoods.find(h => h.id === id);
    if(!hood) return;

    if(activeId && activeId !== id && layers[activeId]){
      const prev = neighbourhoods.find(h => h.id === activeId);
      layers[activeId].setStyle(restingStyle(prev));
    }
    activeId = id;

    layers[id].setStyle(activeStyle());
    layers[id].bringToFront();

    renderOverview(hood);

    popupTitle.textContent = hood.name;
    [sectionRestaurants, sectionActivities, sectionShops].forEach(section => {
      section.classList.remove('is-collapsed');
      section.querySelector('.pick-section-toggle').setAttribute('aria-expanded', 'true');
    });
    const cats = categorizePicks(hood.picks);
    fillSection(picksRestaurants, sectionRestaurants, cats.restaurants);
    fillSection(picksBars, sectionBars, cats.bars);
    fillSection(picksActivities, sectionActivities, cats.activities);
    fillSection(picksShops, sectionShops, cats.shops);
    renderPickMarkers(cats);
    popup.classList.add('is-open');

    document.querySelectorAll('.item').forEach(el => el.classList.toggle('is-active', el.dataset.id === id));

    safeFitBounds(layers[id].getBounds(), { padding: [80,80], maxZoom: 16 });

    if(isMobile()) setPanelCollapsed(true);
  }

  const LABEL_ZOOM_THRESHOLD = 14;
  function updateLabelVisibility(){
    const show = map.getZoom() >= LABEL_ZOOM_THRESHOLD;
    Object.values(layers).forEach(layer => {
      if(show) layer.openTooltip(); else layer.closeTooltip();
    });
  }
  map.on('zoomend', updateLabelVisibility);
  updateLabelVisibility();

  // --- collapse toggle for left panel ---
  const panelEl = document.getElementById('panel');
  const collapseBtn = document.getElementById('collapseBtn');
  function setPanelCollapsed(collapsed){
    panelEl.classList.toggle('is-collapsed', collapsed);
    collapseBtn.innerHTML = collapsed ? '&#9660;' : '&#9650;';
  }
  collapseBtn.addEventListener('click', () => setPanelCollapsed(!panelEl.classList.contains('is-collapsed')));

  // --- minimize toggle for left panel (hides the whole panel, header included) ---
  const minimizeBtn = document.getElementById('minimizeBtn');
  minimizeBtn.addEventListener('click', (e) => {
    e.stopPropagation();
    panelEl.classList.toggle('is-minimized');
  });

  // --- independent collapse for the neighbourhood list only ---
  const listEl = document.getElementById('list');
  const listCollapseBtn = document.getElementById('listCollapseBtn');
  listCollapseBtn.addEventListener('click', () => {
    const collapsed = listEl.classList.toggle('is-collapsed');
    listCollapseBtn.innerHTML = collapsed ? '&#9660;' : '&#9650;';
  });

  // --- itineraries ---
  // Preset, hand-curated groupings. option3-4 are placeholders
  // (they toggle their own pressed state but have no effect on the map yet).
  const ITINERARIES = {
    option1: {
      order: ['chinatown', 'kensington', 'littleitaly'],
      colors: { chinatown: '#7a1414', kensington: '#c0392b', littleitaly: '#e8a3a3' }
    },
    option2: {
      order: ['roncesvalles', 'littleportugal', 'trinity', 'queenwest'],
      colors: { roncesvalles: '#5c1a8c', littleportugal: '#8e44ad', trinity: '#b57edc', queenwest: '#dcc6f0' }
    }
  };
  const ITIN_GRAY = '#9a9a9a';
  let activeItineraryOption = null;

  function fullRestingStyle(hood){
    return Object.assign({ color: hood.color, fillColor: hood.color }, restingStyle(hood));
  }

  function resetAllNeighbourhoodStyles(){
    neighbourhoods.forEach(hood => layers[hood.id].setStyle(fullRestingStyle(hood)));
  }

  function unionBounds(ids){
    let b = null;
    ids.forEach(id => {
      const lb = layers[id].getBounds();
      b = b ? b.extend(lb) : L.latLngBounds(lb.getSouthWest(), lb.getNorthEast());
    });
    return b;
  }

  const itineraryStack = document.getElementById('itineraryStack');
  const itineraryCards = document.getElementById('itineraryCards');

  function itinSectionHtml(label, items){
    if(!items.length) return '';
    return '<h3 style="font-size:0.7rem;text-transform:uppercase;letter-spacing:0.08em;border:none;padding:0;margin:0.6rem 0 0.35rem;color:var(--ink-soft);">' + label + '</h3>'
      + '<ul style="margin:0;padding-left:1.1rem;font-size:0.85rem;line-height:1.55;color:#33404d;">'
      + items.map(it => '<li>' + it.pick.name + ' — ' + it.pick.note + '</li>').join('')
      + '</ul>';
  }

  function renderItineraryStack(key){
    const itin = ITINERARIES[key];
    itineraryCards.innerHTML = itin.order.map(id => {
      const hood = neighbourhoods.find(h => h.id === id);
      const c = itin.colors[id];
      const cats = categorizePicks(hood.picks);
      return '<div class="itin-card" id="itinCard-' + id + '">'
        + '<h3 style="border-color:' + c + '">' + hood.name + '</h3>'
        + '<div class="popup-section" style="margin-top:0;padding-top:0;border-top:none;">'
        + itinSectionHtml('Restaurants', cats.restaurants)
        + itinSectionHtml('Bars/Clubs', cats.bars)
        + itinSectionHtml('Activities', cats.activities)
        + itinSectionHtml('Shops', cats.shops)
        + '</div>';
    }).join('');
    itineraryStack.classList.add('is-open');
  }

  function activateItinerary(key){
    activeItineraryOption = key;
    setItineraryButtonsUI();

    const itin = ITINERARIES[key];
    if(itin){
      neighbourhoods.forEach(hood => {
        if(itin.order.includes(hood.id)){
          layers[hood.id].setStyle({ color: itin.colors[hood.id], fillColor: itin.colors[hood.id], weight: 3.5, opacity: 1, fillOpacity: 0.55 });
          layers[hood.id].bringToFront();
        } else {
          layers[hood.id].setStyle({ color: ITIN_GRAY, fillColor: ITIN_GRAY, weight: 2, opacity: 0.85, fillOpacity: 0.4 });
        }
      });
      renderItineraryStack(key);
      safeFitBounds(unionBounds(itin.order), { padding: [70,70] });
    }
  }

  function deactivateItinerary(){
    if(ITINERARIES[activeItineraryOption]){
      resetAllNeighbourhoodStyles();
      itineraryStack.classList.remove('is-open');
      safeFitBounds(oldTorontoBounds, {});
    }
    activeItineraryOption = null;
    setItineraryButtonsUI();
  }

  function setItineraryButtonsUI(){
    document.querySelectorAll('.itin-btn').forEach(b => {
      const pressed = b.dataset.option === activeItineraryOption;
      b.classList.toggle('is-active', pressed);
      b.setAttribute('aria-pressed', pressed ? 'true' : 'false');
    });
  }

  document.querySelectorAll('.itin-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      const key = btn.dataset.option;
      if(activeId) closePopup();
      if(activeItineraryOption === key){
        deactivateItinerary();
      } else {
        if(activeItineraryOption) deactivateItinerary();
        activateItinerary(key);
      }
    });
  });

  document.getElementById('itineraryStackClose').addEventListener('click', deactivateItinerary);

  const itinBanner = document.getElementById('itinBanner');
  const itinCollapseBtn = document.getElementById('itinCollapseBtn');
  itinCollapseBtn.addEventListener('click', () => {
    const collapsed = itinBanner.classList.toggle('is-collapsed');
    itinCollapseBtn.innerHTML = collapsed ? '&#9660;' : '&#9650;';
  });
  if(isMobile()){
    itinBanner.classList.add('is-collapsed');
    itinCollapseBtn.innerHTML = '&#9660;';
  }

  // --- geolocation ---
  const locateBtn = document.getElementById('locateBtn');
  const locateNote = document.getElementById('locateNote');
  let watchId = null;
  let meMarker = null;
  let meAccuracy = null;

  function showLocateNote(msg){
    locateNote.textContent = msg;
    locateNote.classList.add('is-visible');
    setTimeout(() => locateNote.classList.remove('is-visible'), 4000);
  }

  locateBtn.addEventListener('click', () => {
    if(!navigator.geolocation){
      showLocateNote('Location is not available in this browser.');
      return;
    }
    if(watchId !== null){
      navigator.geolocation.clearWatch(watchId);
      watchId = null;
      locateBtn.classList.remove('is-active');
      if(meMarker){ map.removeLayer(meMarker); meMarker = null; }
      if(meAccuracy){ map.removeLayer(meAccuracy); meAccuracy = null; }
      return;
    }

    locateBtn.classList.add('is-active');
    let firstFix = true;

    watchId = navigator.geolocation.watchPosition(
      pos => {
        const latlng = [pos.coords.latitude, pos.coords.longitude];
        if(!meMarker){
          meMarker = L.marker(latlng, {
            icon: L.divIcon({ className: 'you-are-here', iconSize: [16,16] })
          }).addTo(map);
          meAccuracy = L.circle(latlng, { radius: pos.coords.accuracy, color: '#1a6fd6', weight: 1, fillOpacity: 0.08 }).addTo(map);
        } else {
          meMarker.setLatLng(latlng);
          meAccuracy.setLatLng(latlng).setRadius(pos.coords.accuracy);
        }
        if(firstFix){
          map.panTo(latlng);
          firstFix = false;
        }
      },
      err => {
        locateBtn.classList.remove('is-active');
        watchId = null;
        if(err.code === err.PERMISSION_DENIED){
          showLocateNote('Location access was denied. Enable it in your browser settings to use this.');
        } else {
          showLocateNote('Could not get your location right now.');
        }
      },
      { enableHighAccuracy: true, maximumAge: 10000, timeout: 15000 }
    );
  });
</script>
</body>
</html>
